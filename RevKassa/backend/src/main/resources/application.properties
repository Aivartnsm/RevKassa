spring.application.name=revkassa

# Database (PostgreSQL running in WSL, reachable from Windows via localhost)
spring.datasource.url=jdbc:postgresql://localhost:5432/revkassa
spring.datasource.username=revkassa
spring.datasource.password=revkassa

# Schema comes from docs/database/*.sql scripts (run by hand); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cookies (device cookie, later session cookie) get the Secure flag only over HTTPS; the production profile (B21) sets true
revkassa.secure-cookies=false

# Secrets come from environment variables, never from this file:
#   REVKASSA_PIN_SECRET -> revkassa.pin-secret (required, app does not start without it; dev: dev-pin-secret)
#   REVKASSA_BOOTSTRAP_ADMIN_EMAIL / _PASSWORD / _NAME -> revkassa.bootstrap.admin-* (optional; only used when the
#   database has no active admin: that admin is created on startup and its PIN is logged once)

# Login session cookie (sessions live in server memory; timeouts are set per login: PIN 1 min, password 30 min)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${revkassa.secure-cookies}
server.servlet.session.tracking-modes=cookie

# Email (B25). SMTP only when spring.mail.host is set (env SPRING_MAIL_HOST, _PORT, _USERNAME, _PASSWORD);
# without it emails are written to the log. With SMTP on, app-url, mail.from and invoice.org-name/iban are required.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
revkassa.app-url=http://localhost:5173
revkassa.invoice.due-days=14
