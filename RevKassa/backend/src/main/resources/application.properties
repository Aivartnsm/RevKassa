spring.application.name=revkassa

# Database (PostgreSQL running in WSL, reachable from Windows via localhost)
spring.datasource.url=jdbc:postgresql://localhost:5432/revkassa
spring.datasource.username=revkassa
spring.datasource.password=revkassa

# Schema comes from docs/database/*.sql scripts (run by hand); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cookies (device cookie, later session cookie) get the Secure flag only over HTTPS; the production profile (B21) sets true
revkassa.secure-cookies=false

# Secrets come from environment variables, never from this file:
#   REVKASSA_PIN_SECRET -> revkassa.pin-secret (required, app does not start without it; dev: dev-pin-secret)
