# Test-only settings, loaded on top of src/main/resources/application.properties.
# Same key as docs/database/3_import.sql hashes were made with (never a production secret).
revkassa.pin-secret=dev-pin-secret

# Tests share the dev database: the monthly fee job must not commit charges to it at context start
revkassa.membership-fees.job-enabled=false

# Tests never call Gemini, even when the machine has GOOGLE_API_KEY set
revkassa.ai.api-key=

# Every distinct test setup (own clock, mocks) is a cached Spring context with its own connection pool. Idle pools
# shrink to one connection, so many contexts stay under PostgreSQL's 100 connections; concurrency tests can still
# open up to the default 10 at once.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
